<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chrome Dino Game - Expanded Theater Screen</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background-color: #f7f7f7; font-family: monospace; user-select: none; touch-action: none; overflow: hidden; transition: background-color 0.4s ease; }
        
        /* Greatly expanded screen real estate styling */
        #game-box { position: relative; width: 98%; max-width: 1000px; height: 400px; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 3px solid #dcdcdc; }
        canvas { display: block; border-bottom: 4px solid #535353; width: 100%; height: 100%; border-radius: 12px 12px 0 0; }
        
        /* Main Menu Layout for Massive Screens */
        #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(251, 251, 251, 0.99); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #535353; border-radius: 10px; box-sizing: border-box; padding: 25px; }
        #menu-title { font-size: 30px; font-weight: bold; margin-bottom: 35px; letter-spacing: 2px; color: #222; display: flex; align-items: center; gap: 15px; }
        
        #button-container { display: flex; gap: 20px; width: 90%; max-width: 750px; justify-content: center; }
        .menu-btn { flex: 1; padding: 18px 12px; font-family: inherit; font-size: 14px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; color: white; transition: transform 0.1s ease, box-shadow 0.2s ease; box-shadow: 0 5px 10px rgba(0,0,0,0.12); text-align: center; }
        .menu-btn:active { transform: scale(0.96); }
        
        #btn-hardcore { background-color: #212121; border: 1px solid #000; }
        #btn-normal { background-color: #757575; }
        #btn-birthday { background-color: #e91e63; }
        
        /* HUD score panels scaling */
        #hud-scores { position: absolute; top: 20px; right: 25px; display: flex; gap: 25px; font-size: 18px; font-weight: bold; color: #535353; pointer-events: none; z-index: 10; }
        #lives-display { color: #535353; transition: color 0.3s ease; }
        
        /* Left corner interactive countdown display for flight powerups */
        #fly-display { position: absolute; top: 20px; left: 25px; font-size: 18px; font-weight: bold; color: #00e5ff; display: none; pointer-events: none; z-index: 10; background: rgba(0, 0, 0, 0.05); padding: 4px 10px; border-radius: 6px; border: 1px dashed #00e5ff; text-shadow: 1px 1px 0px rgba(255,255,255,0.5); }
        
        /* Action buttons footer layout */
        #game-over { display: none; position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #535353; z-index: 20; }
        #game-over-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 25px; min-width: 280px; }
        #game-over button { color: white; border: none; padding: 12px 24px; font-size: 14px; font-weight: bold; font-family: inherit; border-radius: 8px; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.16); transition: transform 0.1s ease; }
        #game-over button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="game-box">
        <!-- Interactive Main Menu Overlay -->
        <div id="start-overlay">
            <div id="menu-title">🦖 CHOOSE YOUR GAME MODE</div>
            <div id="button-container">
                <button class="menu-btn" id="btn-hardcore">HARDCORE MODE<br><span style="font-size:11px;opacity:0.8;font-weight:normal;display:inline-block;margin-top:6px;">1 Life | No Restarts</span></button>
                <button class="menu-btn" id="btn-normal">NORMAL MODE<br><span style="font-size:11px;opacity:0.8;font-weight:normal;display:inline-block;margin-top:6px;">Standard Setup</span></button>
                <button class="menu-btn" id="btn-birthday">BIRTHDAY EDITION<br><span style="font-size:11px;opacity:0.8;font-weight:normal;display:inline-block;margin-top:6px;">2 Lives + Flying Birds</span></button>
            </div>
        </div>

        <!-- Left Right Corner Floating HUD items -->
        <div id="fly-display">FLY TIME: 5.0s</div>

        <div id="hud-scores">
            <div id="lives-display">LIVES: 1</div>
            <div id="hi-score">HI 00000</div>
            <div id="score">00000</div>
        </div>

        <div id="game-over">
            <h1 id="game-over-text" style="font-size: 34px; margin: 0; letter-spacing: 4px;">G A M E  O V E R</h1>
            <div id="game-over-buttons">
                <button id="restart-btn">RESTART</button>
                <button id="menu-btn">MAIN MENU</button>
            </div>
        </div>

        <canvas id="dinoCanvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById("dinoCanvas");
    const ctx = canvas.getContext("2d");
    
    // Maximized raw internal hardware workspace dimensions
    canvas.width = 1000;
    canvas.height = 400;

    const groundY = 340; // Floor guide height row mapping

    let score = 0;
    let highScore = localStorage.getItem("dino_hi_fixed") || 0;
    let isGameOver = false;
    let gameActive = false;
    let speed = 7.5; 
    let spawnTimer = 0;
    let hatSpawnTimer = 0;
    let birdSpawnTimer = 0;

    let gameMode = 'normal'; 
    let lives = 1;
    let invulnerabilityTimer = 0;
    let dinoFlyTimer = 0; // Flight duration countdown loop (measured in frames)
    
    let obstacles = [];
    let hats = [];
    let birds = [];
    let confettiParticles = [];

    document.getElementById("hi-score").innerText = `HI ${String(highScore).padStart(5, '0')}`;

    // Re-proportioned player configurations matching massive display boundaries
    let dino = { 
        x: 80, 
        y: groundY - 56, 
        w: 52, 
        h: 56, 
        vy: 0, 
        gravity: 0.85, 
        jump: -16.5,   
        grounded: true, 
        legToggle: false, 
        timer: 0 
    };

    document.getElementById("btn-hardcore").addEventListener("click", (e) => selectMode('hardcore'));
    document.getElementById("btn-normal").addEventListener("click", (e) => selectMode('normal'));
    document.getElementById("btn-birthday").addEventListener("click", (e) => selectMode('birthday'));

    function selectMode(mode) {
        gameMode = mode;
        document.getElementById("start-overlay").style.display = "none";
        gameActive = true;
        
        const restartBtn = document.getElementById("restart-btn");
        const menuBtn = document.getElementById("menu-btn");

        if (gameMode === 'hardcore') {
            lives = 1;
            document.body.style.backgroundColor = "#e0e0e0";
            document.getElementById("lives-display").style.color = "#000000";
            restartBtn.style.backgroundColor = "#212121";
            menuBtn.style.backgroundColor = "#212121";
        } else if (gameMode === 'normal') {
            lives = 1;
            document.body.style.backgroundColor = "#f7f7f7";
            document.getElementById("lives-display").style.color = "#535353";
            restartBtn.style.backgroundColor = "#535353";
            menuBtn.style.backgroundColor = "#535353";
        } else if (gameMode === 'birthday') {
            lives = 2;
            document.body.style.backgroundColor = "#fce4ec";
            document.getElementById("lives-display").style.color = "#e91e63";
            restartBtn.style.backgroundColor = "#e91e63";
            menuBtn.style.backgroundColor = "#e91e63";
        }
        
        document.getElementById("lives-display").innerText = `LIVES: ${lives}`;
        triggerJump();
    }

    window.addEventListener("keydown", (e) => {
        if ([" ", "arrowup", "w"].includes(e.key.toLowerCase())) {
            e.preventDefault();
            triggerJump();
        }
    });

    canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        triggerJump();
    });

    document.getElementById("restart-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        resetGame();
    });

    document.getElementById("menu-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        returnToMenu();
    });

    function triggerJump() {
        if (!gameActive || isGameOver) return;
        
        // If flight timer is active, allow unlimited mid-air jumps (flapping upwards)
        if (dino.grounded || dinoFlyTimer > 0) {
            dino.vy = dinoFlyTimer > 0 ? dino.jump * 0.85 : dino.jump; 
            dino.grounded = false;
            
            // Generate audio cues
            if (dinoFlyTimer > 0) {
                playAudioBeep(440, 0.04); // Flapping wing synth sound
            } else {
                playAudioBeep(330, 0.05); // Classic jump sound
            }
        }
    }

    function createObstacle() {
        let isTall = Math.random() > 0.5;
        
        if (gameMode === 'birthday') {
            obstacles.push({
                x: canvas.width,
                y: isTall ? groundY - 70 : groundY - 46,
                w: isTall ? 36 : 50,
                h: isTall ? 70 : 46,
                type: isTall ? 'cake' : 'gift'
            });
        } else {
            obstacles.push({
                x: canvas.width,
                y: isTall ? groundY - 70 : groundY - 46,
                w: isTall ? 28 : 46,
                h: isTall ? 70 : 46,
                type: 'classic'
            });
        }
    }

    function createHat() {
        hats.push({
            x: canvas.width,
            y: 130 + Math.random() * 80,
            w: 36,
            h: 42
        });
    }

    function createBird() {
        // Spawn a flying birthday bird at mid-level screen heights
        birds.push({
            x: canvas.width,
            y: 120 + Math.random() * 70,
            w: 42,
            h: 32,
            wingToggle: false,
            timer: 0
        });
    }

    function createConfetti(x, y) {
        const colors = ["#ff4081", "#ffeb3b", "#00e5ff", "#76ff03", "#e040fb", "#ff6e40"];
        for (let i = 0; i < 40; i++) { 
            confettiParticles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.7) * 10,
                size: Math.random() * 6 + 3,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1,
                decay: Math.random() * 0.012 + 0.008
            });
        }
    }

    function update() {
        if (!gameActive || isGameOver) return;

        let rate = gameMode === 'hardcore' ? 0.28 : 0.20;
        let speedScale = gameMode === 'hardcore' ? 0.0022 : 0.0014;
        
        score += rate;
        speed += speedScale;
        document.getElementById("score").innerText = String(Math.floor(score)).padStart(5, '0');

        if (invulnerabilityTimer > 0) {
            invulnerabilityTimer--;
        }

        // Live Fly Ability Processing
        if (dinoFlyTimer > 0) {
            dinoFlyTimer--;
            const flyElement = document.getElementById("fly-display");
            flyElement.style.display = "block";
            flyElement.innerText = `FLY TIME: ${(dinoFlyTimer / 60).toFixed(1)}s`;
            
            if (dinoFlyTimer === 0) {
                flyElement.style.display = "none";
            }
        }

        // Apply physics matrix properties
        dino.vy += dino.gravity;
        dino.y += dino.vy;

        // Keep bounds directly on floor level tracking
        if (dino.y >= groundY - dino.h) {
            dino.y = groundY - dino.h;
            dino.vy = 0;
            dino.grounded = true;
        }
        
        // Ceiling lock container limits to prevent flying entirely out of bounds
        if (dino.y < 0) {
            dino.y = 0;
            dino.vy = 0;
        }

        dino.timer++;
        if (dino.timer % 7 === 0) dino.legToggle = !dino.legToggle;

        spawnTimer++;
        let dynamicGap = Math.max(60, 100 - Math.floor(speed * 1.6));
        if (spawnTimer > dynamicGap + Math.random() * 65) {
            createObstacle();
            spawnTimer = 0;
        }

        if (gameMode === 'birthday') {
            hatSpawnTimer++;
            if (hatSpawnTimer > 230 + Math.random() * 150) {
                createHat();
                hatSpawnTimer = 0;
            }

            // Manage floating birds spawning timelines
            birdSpawnTimer++;
            if (birdSpawnTimer > 380 + Math.random() * 250) {
                createBird();
                birdSpawnTimer = 0;
            }
        }

        for (let i = confettiParticles.length - 1; i >= 0; i--) {
            let p = confettiParticles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.alpha -= p.decay;
            if (p.alpha <= 0) confettiParticles.splice(i, 1);
        }

        // Collectible Hats Processing Loop
        for (let i = hats.length - 1; i >= 0; i--) {
            let h = hats[i];
            h.x -= speed;
            if (h.x + h.w < 0) { hats.splice(i, 1); continue; }

            if (dino.x < h.x + h.w && dino.x + dino.w > h.x && dino.y < h.y + h.h && dino.y + dino.h > h.y) {
                lives += 2;
                document.getElementById("lives-display").innerText = `LIVES: ${lives}`;
                playAudioBeep(523.25, 0.08);
                setTimeout(() => playAudioBeep(659.25, 0.12), 70);
                createConfetti(h.x + h.w / 2, h.y + h.h / 2);
                hats.splice(i, 1);
            }
        }

        // Flying Birds Power-up Processing Loop
        for (let i = birds.length - 1; i >= 0; i--) {
            let b = birds[i];
            b.x -= speed * 1.15; // Birds push past obstacles a bit faster
            b.timer++;
            if (b.timer % 8 === 0) b.wingToggle = !b.wingToggle;

            if (b.x + b.w < 0) { birds.splice(i, 1); continue; }

            // Collide with bird to activate 5 second flight parameters
            if (dino.x < b.x + b.w && dino.x + dino.w > b.x && dino.y < b.y + b.h && dino.y + dino.h > b.y) {
                dinoFlyTimer = 300; // 5 Seconds * 60 Frames per Second
                playAudioBeep(587.33, 0.1); 
                setTimeout(() => playAudioBeep(783.99, 0.15), 60);
                createConfetti(b.x + b.w / 2, b.y + b.h / 2);
                birds.splice(i, 1);
            }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let o = obstacles[i];
            o.x -= speed;
            if (o.x + o.w < 0) { obstacles.splice(i, 1); continue; }

            if (invulnerabilityTimer === 0 && dino.x < o.x + o.w && dino.x + dino.w > o.x && dino.y < o.y + o.h && dino.y + dino.h > o.y) {
                if (lives > 1) {
                    lives--;
                    invulnerabilityTimer = 65; 
                    document.getElementById("lives-display").innerText = `LIVES: ${lives}`;
                    playAudioBeep(180, 0.25);
                    obstacles.splice(i, 1);
                } else {
                    lives = 0;
                    document.getElementById("lives-display").innerText = `LIVES: ${lives}`;
                    triggerGameOver();
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        confettiParticles.forEach(p => {
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size); ctx.restore();
        });

        // 1. Draw Player Dino (Rescaled grid vectors)
        if (invulnerabilityTimer === 0 || Math.floor(invulnerabilityTimer / 4) % 2 === 0) {
            ctx.fillStyle = gameMode === 'hardcore' ? "#212121" : "#535353";
            ctx.fillRect(dino.x + 10, dino.y, 32, 28); 
            ctx.fillRect(dino.x, dino.y + 18, 28, 24); 
            
            ctx.fillStyle = gameMode === 'birthday' ? "#ffffff" : "#f7f7f7";
            if (gameMode === 'hardcore') ctx.fillStyle = "#e0e0e0";
            ctx.fillRect(dino.x + 28, dino.y + 4, 4, 4); 
            
            ctx.fillStyle = gameMode === 'hardcore' ? "#212121" : "#535353";

            if (dino.grounded) {
                if (dino.legToggle) {
                    ctx.fillRect(dino.x + 6, dino.y + 42, 6, 14);
                    ctx.fillRect(dino.x + 24, dino.y + 42, 6, 6);
                } else {
                    ctx.fillRect(dino.x + 6, dino.y + 42, 6, 6);
                    ctx.fillRect(dino.x + 24, dino.y + 42, 6, 14);
                }
            } else {
                ctx.fillRect(dino.x + 6, dino.y + 42, 6, 10);
                ctx.fillRect(dino.x + 24, dino.y + 42, 6, 10);
            }

            // Party Hat Decoration
            if (gameMode === 'birthday') {
                ctx.fillStyle = "#00e5ff";
                ctx.beginPath();
                ctx.moveTo(dino.x + 26, dino.y - 16);
                ctx.lineTo(dino.x + 12, dino.y);
                ctx.lineTo(dino.x + 36, dino.y);
                ctx.closePath(); ctx.fill();
                
                ctx.fillStyle = "#ffeb3b";
                ctx.beginPath(); ctx.arc(dino.x + 26, dino.y - 16, 5, 0, Math.PI * 2); ctx.fill();
                
                // Draw little wings directly on dino frame when flight powers are unlocked
                if (dinoFlyTimer > 0) {
                    ctx.fillStyle = "#ff4081";
                    if (Math.floor(dinoFlyTimer / 6) % 2 === 0) {
                        ctx.fillRect(dino.x - 14, dino.y + 14, 16, 10); // Flap up
                    } else {
                        ctx.fillRect(dino.x - 14, dino.y + 22, 16, 10); // Flap down
                    }
                }
            }
        }

        // 2. Draw Spawning Obstacles
        obstacles.forEach(o => {
            if (o.type === 'cake') {
                ctx.fillStyle = "#ff8a80"; ctx.fillRect(o.x, o.y + 18, o.w, o.h - 18);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(o.x, o.y + 18, o.w, 6); ctx.fillRect(o.x, o.y + 36, o.w, 4);
                ctx.fillStyle = "#00e5ff"; ctx.fillRect(o.x + o.w/2 - 3, o.y, 6, 18);
                ctx.fillStyle = "#ff3d00"; ctx.fillRect(o.x + o.w/2 - 2, o.y - 6, 4, 6);
            } else if (o.type === 'gift') {
                ctx.fillStyle = "#ea80fc"; ctx.fillRect(o.x, o.y, o.w, o.h);
                ctx.fillStyle = "#ffff00"; ctx.fillRect(o.x + o.w/2 - 4, o.y, 8, o.h); ctx.fillRect(o.x, o.y + o.h/2 - 4, o.w, 4);
                ctx.fillRect(o.x + 4, o.y - 6, 12, 6); ctx.fillRect(o.x + o.w - 16, o.y - 6, 12, 6);
            } else {
                ctx.fillStyle = gameMode === 'hardcore' ? "#212121" : "#535353";
                ctx.fillRect(o.x, o.y, o.w, o.h);
            }
        });

        // 3. Draw Floating Collectible Hats
        if (gameMode === 'birthday') {
            hats.forEach(h => {
                ctx.fillStyle = "#ff4081";
                ctx.beginPath();
                ctx.moveTo(h.x + h.w / 2, h.y); ctx.lineTo(h.x, h.y + h.h); ctx.lineTo(h.x + h.w, h.y + h.h);
                box = ctx.closePath(); ctx.fill();

                ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(h.x + h.w * 0.25, h.y + h.h * 0.5); ctx.lineTo(h.x + h.w * 0.75, h.y + h.h * 0.7); ctx.stroke();

                ctx.fillStyle = "#ffeb3b";
                ctx.beginPath(); ctx.arc(h.x + h.w / 2, h.y, 6, 0, Math.PI * 2); ctx.fill();
            });

            // 4. Draw Floating Birds
            birds.forEach(b => {
                ctx.fillStyle = "#00e5ff"; // Bright cyan body mesh
                ctx.fillRect(b.x + 8, b.y + 6, 22, 16);
                ctx.fillRect(b.x + 24, b.y + 2, 8, 10); // Head
                
                ctx.fillStyle = "#ffeb3b"; // Yellow beak
                ctx.fillRect(b.x + 32, b.y + 4, 8, 5);
                
                ctx.fillStyle = "#00b0ff"; // Animated wing panels
                if (b.wingToggle) {
                    ctx.fillRect(b.x + 12, b.y - 6, 6, 14);
                } else {
                    ctx.fillRect(b.x + 12, b.y + 14, 6, 14);
                }
            });
        }

        // 5. Floor guide line
        ctx.fillStyle = "#535353";
        ctx.fillRect(0, groundY, canvas.width, 3);
    }

    function triggerGameOver() {
        isGameOver = true;
        const restartBtn = document.getElementById("restart-btn");
        
        if (gameMode === 'birthday') {
            document.getElementById("game-over-text").innerText = "🎉 GAME OVER 🎉";
            document.getElementById("game-over-text").style.color = "#e91e63";
            restartBtn.style.display = "inline-block";
        } else if (gameMode === 'hardcore') {
            document.getElementById("game-over-text").innerText = "💀 HARDCORE OVER 💀";
            document.getElementById("game-over-text").style.color = "#000000";
            restartBtn.style.display = "none";
        } else {
            document.getElementById("game-over-text").innerText = "G A M E  O V E R";
            document.getElementById("game-over-text").style.color = "#535353";
            restartBtn.style.display = "inline-block";
        }

        document.getElementById("game-over").style.display = "block";
        playAudioBeep(100, 0.25);

        if (score > highScore) {
            highScore = Math.floor(score);
            localStorage.setItem("dino_hi_fixed", highScore);
            document.getElementById("hi-score").innerText = `HI ${String(highScore).padStart(5, '0')}`;
        }
    }

    function resetGame() {
        score = 0;
        isGameOver = false;
        gameActive = true;
        speed = 7.5;
        spawnTimer = 0;
        hatSpawnTimer = 0;
        birdSpawnTimer = 0;
        invulnerabilityTimer = 0;
        dinoFlyTimer = 0;
        obstacles = [];
        hats = [];
        birds = [];
        confettiParticles = [];
        dino.y = groundY - dino.h;
        dino.vy = 0;
        dino.grounded = true;
        
        if (gameMode === 'hardcore') lives = 1;
        else if (gameMode === 'normal') lives = 1;
        else if (gameMode === 'birthday') lives = 2;

        document.getElementById("game-over").style.display = "none";
        document.getElementById("fly-display").style.display = "none";
        document.getElementById("lives-display").innerText = `LIVES: ${lives}`;
        triggerJump();
    }

    function returnToMenu() {
        score = 0;
        isGameOver = false;
        gameActive = false;
        speed = 7.5;
        spawnTimer = 0;
        hatSpawnTimer = 0;
        birdSpawnTimer = 0;
        invulnerabilityTimer = 0;
        dinoFlyTimer = 0;
        obstacles = [];
        hats = [];
        birds = [];
        confettiParticles = [];
        dino.y = groundY - dino.h;
        dino.vy = 0;
        dino.grounded = true;
        
        document.getElementById("game-over").style.display = "none";
        document.getElementById("fly-display").style.display = "none";
        document.getElementById("start-overlay").style.display = "flex";
        document.body.style.backgroundColor = "#f7f7f7";
    }

    function playAudioBeep(freq, length) {
        try {
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = "square";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + length);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + length);
        } catch (e) {
            console.log("Audio pipeline initialized securely");
        }
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
    
    gameLoop();
</script>

</body>
</html>
